<h5>Please, provide your credentials below</h5>
<form>
  <mat-form-field appearance="fill">
    <mat-label>User Name</mat-label>
    <input matInput placeholder="Enter your username" name="usename" type="text"
      [formControl]="usernameFormControl">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Password</mat-label>
    <input matInput placeholder="Enter your password" value="" name="password" type="password"
      [formControl]="passwordFormControl">
    @if (passwordFormControl.hasError('passwordStrength')) {
      <mat-error>Password must be at least 6 characters long and contain an uppercase letter, a lowercase letter, a digit and a special character</mat-error>
    }
  </mat-form-field>
  <button mat-raised-button color="primary" [disabled]="loggingIn()" (click)="submit()">
    @if (loggingIn()) {
      <span><mat-spinner diameter="20"></mat-spinner></span>
    }
    @if (!loggingIn()) {
      <span>Submit</span>
    }
  </button>
  @if (showLoggedIn()) {
    <span><button mat-button color="accent">You are now logged in!</button></span>
  }
  @if (errorOccured()) {
    <span><button mat-button color="accent">There was an error during login attempt. Please try
    again.</button></span>
  }
</form>
